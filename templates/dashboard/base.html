{% load static %}
{% load money_filters %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel Privado | Poppy Cartagena</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        :root{
            --bg:#f6f1ea;
            --surface:#fffdf9;
            --line:#e5d8cb;
            --text:#1f1a17;
            --muted:#6e6258;
            --accent:#9c6b43;
            --accent-dark:#7f5330;
            --sidebar:#171311;
            --sidebar-text:#f7f1ea;
            --danger:#b85b4b;
            --shadow:0 10px 30px rgba(31, 26, 23, 0.08);
            --radius:18px;
        }

        *{
            box-sizing:border-box;
        }

        body{
            margin:0;
            font-family:Arial, sans-serif;
            background:var(--bg);
            color:var(--text);
        }

        a{
            text-decoration:none;
            color:inherit;
        }

        .panel-layout{
            display:grid;
            grid-template-columns:260px 1fr;
            min-height:100vh;
        }

        .sidebar{
            background:var(--sidebar);
            color:var(--sidebar-text);
            padding:28px 20px;
        }

        .sidebar h2{
            margin:0 0 28px;
            font-size:20px;
            letter-spacing:0.06em;
            text-transform:uppercase;
        }

        .sidebar .section-title{
            margin:26px 0 12px;
            font-size:12px;
            text-transform:uppercase;
            letter-spacing:0.12em;
            opacity:0.65;
        }

        .sidebar a{
            display:block;
            padding:12px 14px;
            border-radius:12px;
            color:rgba(255,255,255,0.9);
            margin-bottom:6px;
        }

        .sidebar a:hover{
            background:rgba(255,255,255,0.08);
        }

        .main{
            padding:28px;
        }

        .topbar{
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:16px;
            margin-bottom:26px;
        }

        .topbar h1{
            margin:0;
            font-size:30px;
        }

        .topbar .meta{
            color:var(--muted);
            font-size:14px;
        }

        .grid{
            display:grid;
            gap:20px;
        }

        .grid-4{
            grid-template-columns:repeat(4, minmax(0, 1fr));
        }

        .grid-2{
            grid-template-columns:repeat(2, minmax(0, 1fr));
        }

        .card{
            background:var(--surface);
            border:1px solid var(--line);
            border-radius:var(--radius);
            box-shadow:var(--shadow);
            padding:22px;
        }

        .card h3{
            margin-top:0;
        }

        .kpi{
            display:flex;
            flex-direction:column;
            gap:8px;
        }

        .kpi-label{
            color:var(--muted);
            font-size:13px;
            text-transform:uppercase;
            letter-spacing:0.08em;
        }

        .kpi-value{
            font-size:34px;
            font-weight:700;
        }

        .table-like{
            display:flex;
            flex-direction:column;
            gap:12px;
        }

        .row{
            display:flex;
            justify-content:space-between;
            gap:16px;
            padding:12px 0;
            border-bottom:1px solid var(--line);
        }

        .row:last-child{
            border-bottom:none;
        }

        .muted{
            color:var(--muted);
        }

        .danger{
            color:var(--danger);
            font-weight:700;
        }

        @media (max-width: 1100px){
            .grid-4{
                grid-template-columns:repeat(2, minmax(0, 1fr));
            }

            .grid-2{
                grid-template-columns:1fr;
            }
        }

        @media (max-width: 800px){
            .panel-layout{
                grid-template-columns:1fr;
            }

            .sidebar{
                padding:20px;
            }

            .grid-4{
                grid-template-columns:1fr;
            }
        }
    </style>
</head>
<body>
    <div class="panel-layout">
        <aside class="sidebar">
            <h2>Poppy Panel</h2>

            <div class="section-title">Principal</div>
            <a href="/panel/dashboard/">Dashboard</a>

            <div class="section-title">Gestión</div>
            <a href="/panel/inventario/">Inventario</a>
            <a href="/panel/clientes/">Clientes</a>
            <a href="/panel/pedidos/">Pedidos</a>
            <a href="/panel/ventas/">Ventas</a>
            <a href="/panel/productos/">Productos</a>
            <a href="/panel/proveedores/">Proveedores</a>
            <a href="/panel/compras/">Compras</a>

<div class="section-title">Sistema</div>
<a href="/admin/">Admin Django</a>
<a href="/">Volver al sitio</a>
        </aside>

        <main class="main">
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
