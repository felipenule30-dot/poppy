{% extends "dashboard/base.html" %}
{% load money_filters %}

{% block content %}

<div class="topbar">
    <div>
        <h1>Nueva venta</h1>
        <div class="meta">Registrar venta manual</div>
    </div>
</div>

<div class="card" style="max-width:700px;">

<form method="post">
{% csrf_token %}

<div style="display:grid; gap:18px;">

<div>
<label>Cliente</label>

<select name="cliente" style="width:100%; padding:12px; margin-top:6px;">
<option value="">Sin cliente</option>

{% for cliente in clientes %}
<option value="{{ cliente.id }}">
{{ cliente.nombre }}
</option>
{% endfor %}

</select>
</div>

<div>
<label>Canal</label>

<select name="canal" style="width:100%; padding:12px; margin-top:6px;">
{% for key,label in canales %}
<option value="{{ key }}">{{ label }}</option>
{% endfor %}
</select>
</div>

<div>
<label>Producto</label>

<select name="producto" style="width:100%; padding:12px; margin-top:6px;">
{% for producto in productos %}
<option value="{{ producto.id }}">
{{ producto.nombre }} — {{ producto.precio|cop }}
</option>
{% endfor %}
</select>
</div>

<div>
<label>Cantidad</label>
<input type="number" name="cantidad" value="1" style="width:100%; padding:12px;">
</div>

<div>
<label>Descuento %</label>
<input type="number" step="0.01" name="descuento_porcentaje" value="0" style="width:100%; padding:12px;">
</div>

<div>
<label>Notas</label>
<textarea name="notas" rows="4" style="width:100%; padding:12px;"></textarea>
</div>

<div style="display:flex; gap:12px; flex-wrap:wrap;">

<button type="submit" style="
padding:12px 18px;
border:none;
border-radius:12px;
background:var(--accent);
color:white;
">
Crear venta
</button>

<a href="{% url 'panel_ventas' %}" style="
padding:12px 18px;
border:1px solid var(--line);
border-radius:12px;
">
Cancelar
</a>

</div>

</div>

</form>

</div>

{% endblock %}
