{% extends "dashboard/base.html" %}

{% block content %}

<div class="topbar">
    <div>
        <h1>Editar proveedor</h1>
        <div class="meta">{{ proveedor.nombre }}</div>
    </div>
</div>

<div class="card" style="max-width: 760px;">
    <form method="post">
        {% csrf_token %}

        <div style="display:grid; gap:18px;">
            <div>
                <label>Nombre</label>
                <input type="text" name="nombre" value="{{ proveedor.nombre }}" required style="width:100%; padding:12px; margin-top:6px;">
            </div>

            <div>
                <label>Contacto</label>
                <input type="text" name="contacto" value="{{ proveedor.contacto }}" style="width:100%; padding:12px; margin-top:6px;">
            </div>

            <div>
                <label>Teléfono</label>
                <input type="text" name="telefono" value="{{ proveedor.telefono }}" style="width:100%; padding:12px; margin-top:6px;">
            </div>

            <div>
                <label>WhatsApp</label>
                <input type="text" name="whatsapp" value="{{ proveedor.whatsapp }}" style="width:100%; padding:12px; margin-top:6px;">
            </div>

            <div>
                <label>Email</label>
                <input type="email" name="email" value="{{ proveedor.email }}" style="width:100%; padding:12px; margin-top:6px;">
            </div>

            <div>
                <label>Ciudad</label>
                <input type="text" name="ciudad" value="{{ proveedor.ciudad }}" style="width:100%; padding:12px; margin-top:6px;">
            </div>

            <div>
                <label>País</label>
                <input type="text" name="pais" value="{{ proveedor.pais }}" style="width:100%; padding:12px; margin-top:6px;">
            </div>

            <div>
                <label>Tiempo de entrega (días)</label>
                <input type="number" name="tiempo_entrega_dias" value="{{ proveedor.tiempo_entrega_dias }}" style="width:100%; padding:12px; margin-top:6px;">
            </div>

            <div>
                <label>Notas</label>
                <textarea name="notas" rows="4" style="width:100%; padding:12px; margin-top:6px;">{{ proveedor.notas }}</textarea>
            </div>

            <div>
                <label><input type="checkbox" name="activo" {% if proveedor.activo %}checked{% endif %}> Activo</label>
            </div>

            <div style="display:flex; gap:12px; flex-wrap:wrap;">
                <button type="submit" style="padding:12px 18px; border:none; border-radius:12px; background:var(--accent); color:white;">
                    Guardar cambios
                </button>

                <a href="{% url 'panel_proveedores' %}" style="padding:12px 18px; border:1px solid var(--line); border-radius:12px;">
                    Cancelar
                </a>
            </div>
        </div>
    </form>
</div>

{% endblock %}
