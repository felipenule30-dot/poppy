{% extends "dashboard/base.html" %}

{% block content %}

<div class="topbar">
    <div>
        <h1>Editar cliente</h1>
        <div class="meta">{{ cliente.nombre }}</div>
    </div>
</div>

<div class="card" style="max-width: 760px;">
    <form method="post">
        {% csrf_token %}

        <div style="display:grid; gap:18px;">
            <div>
                <label>Nombre</label>
                <input type="text" name="nombre" value="{{ cliente.nombre }}" required style="width:100%; padding:12px; margin-top:6px;">
            </div>

            <div>
                <label>Teléfono</label>
                <input type="text" name="telefono" value="{{ cliente.telefono }}" style="width:100%; padding:12px; margin-top:6px;">
            </div>

            <div>
                <label>WhatsApp</label>
                <input type="text" name="whatsapp" value="{{ cliente.whatsapp }}" style="width:100%; padding:12px; margin-top:6px;">
            </div>

            <div>
                <label>Email</label>
                <input type="email" name="email" value="{{ cliente.email }}" style="width:100%; padding:12px; margin-top:6px;">
            </div>

            <div>
                <label>Documento</label>
                <input type="text" name="documento" value="{{ cliente.documento }}" style="width:100%; padding:12px; margin-top:6px;">
            </div>

            <div>
                <label>Ciudad</label>
                <input type="text" name="ciudad" value="{{ cliente.ciudad }}" style="width:100%; padding:12px; margin-top:6px;">
            </div>

            <div>
                <label>Instagram</label>
                <input type="text" name="instagram" value="{{ cliente.instagram }}" style="width:100%; padding:12px; margin-top:6px;">
            </div>

            <div>
                <label>Notas</label>
                <textarea name="notas" rows="4" style="width:100%; padding:12px; margin-top:6px;">{{ cliente.notas }}</textarea>
            </div>

            <div>
                <label><input type="checkbox" name="recurrente" {% if cliente.recurrente %}checked{% endif %}> Recurrente</label>
            </div>

            <div>
                <label><input type="checkbox" name="activo" {% if cliente.activo %}checked{% endif %}> Activo</label>
            </div>

            <div style="display:flex; gap:12px; flex-wrap:wrap;">
                <button type="submit" style="padding:12px 18px; border:none; border-radius:12px; background:var(--accent); color:white;">
                    Guardar cambios
                </button>

                <a href="{% url 'panel_clientes' %}" style="padding:12px 18px; border:1px solid var(--line); border-radius:12px;">
                    Cancelar
                </a>
            </div>
        </div>
    </form>
</div>

{% endblock %}
