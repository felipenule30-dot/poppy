
{% extends "dashboard/base.html" %}
{% load money_filters %}
{% block content %}

<div class="topbar">
<div>
<h1>Nuevo producto</h1>
<div class="meta">Crear producto para catálogo</div>
</div>
</div>

<div class="card" style="max-width:900px;">

<form method="post">
{% csrf_token %}

<div style="display:grid;gap:18px;">

<div>
<label>Nombre</label>
<input type="text" name="nombre" required style="width:100%;padding:12px;margin-top:6px;">
</div>

<div>
<label>Slug</label>
<input type="text" name="slug" style="width:100%;padding:12px;margin-top:6px;">
</div>

<div>
<label>Colección</label>
<select name="coleccion" required style="width:100%;padding:12px;margin-top:6px;">

<option value="">Selecciona colección</option>

{% for coleccion in colecciones %}
<option value="{{ coleccion.id }}">
{{ coleccion.nombre }}
</option>
{% endfor %}

</select>
</div>

<div>
<label>Proveedor</label>
<select name="proveedor" style="width:100%;padding:12px;margin-top:6px;">
<option value="">Sin proveedor</option>

{% for proveedor in proveedores %}
<option value="{{ proveedor.id }}">
{{ proveedor.nombre }}
</option>
{% endfor %}

</select>
</div>

<div>
<label>Descripción</label>
<textarea name="descripcion" rows="4" style="width:100%;padding:12px;margin-top:6px;"></textarea>
</div>

<div>
<label>Material</label>
<input type="text" name="material" style="width:100%;padding:12px;margin-top:6px;">
</div>

<div>
<label>Precio venta</label>
<input type="number" step="0.01" name="precio" required style="width:100%;padding:12px;margin-top:6px;">
</div>

<hr>

<div>
<label>Costo adquisición</label>
<input type="number" step="0.01" name="costo_adquisicion" style="width:100%;padding:12px;margin-top:6px;">
</div>

<div>
<label>Tiempo adquisición (días)</label>
<input type="number" name="tiempo_adquisicion_dias" value="0" style="width:100%;padding:12px;margin-top:6px;">
</div>

<div>
<label>Stock objetivo</label>
<input type="number" name="stock_objetivo" value="0" style="width:100%;padding:12px;margin-top:6px;">
</div>

<div>
<label>Notas internas</label>
<textarea name="notas_internas" rows="4" style="width:100%;padding:12px;margin-top:6px;"></textarea>
</div>

<div>
<label><input type="checkbox" name="destacado"> Destacado</label>
</div>

<div>
<label><input type="checkbox" name="activo" checked> Activo</label>
</div>

<div style="display:flex;gap:12px;flex-wrap:wrap;">

<button type="submit" style="
padding:12px 18px;
border:none;
border-radius:12px;
background:var(--accent);
color:white;
">
Crear producto
</button>

<a href="{% url 'panel_productos' %}" style="
padding:12px 18px;
border:1px solid var(--line);
border-radius:12px;
">
Cancelar
</a>

</div>

</div>

</form>

</div>

{% endblock %}
