{% extends "dashboard/base.html" %}

{% block content %}

<div class="topbar">
<div>
<h1>Eliminar venta</h1>
<div class="meta">Venta #{{ venta.id }}</div>
</div>
</div>

<div class="card" style="max-width:600px;">

<p>¿Seguro que quieres eliminar esta venta?</p>

<p><strong>Total:</strong> {{ venta.total }}</p>

<form method="post">
{% csrf_token %}

<div style="display:flex; gap:12px; flex-wrap:wrap;">

<button type="submit" style="
padding:12px 18px;
border:none;
border-radius:12px;
background:#b42318;
color:white;
">
Eliminar venta
</button>

<a href="{% url 'panel_ventas' %}" style="
padding:12px 18px;
border:1px solid var(--line);
border-radius:12px;
">
Cancelar
</a>

</div>

</form>

</div>

{% endblock %}
