{% extends "dashboard/base.html" %}
{% load money_filters %}

{% block content %}

<div class="topbar">
    <div>
        <h1>Editar producto</h1>
        <div class="meta">{{ producto.nombre }}</div>
    </div>

    <div style="display:flex; gap:10px; flex-wrap:wrap;">
        <a href="{% url 'panel_producto_imagenes' producto.id %}" style="padding:12px 18px; border:1px solid var(--line); border-radius:12px;">
            Gestionar imágenes
        </a>

        <a href="{% url 'panel_producto_eliminar' producto.id %}" style="padding:12px 18px; border:1px solid #f3c7c7; border-radius:12px; color:#b42318;">
            Eliminar producto
        </a>
    </div>
</div>

<div class="card" style="max-width:900px;">
    <form method="post">
        {% csrf_token %}

        <div style="display:grid; gap:18px;">
            <div>
                <label>Nombre</label>
                <input type="text" name="nombre" value="{{ producto.nombre }}" required style="width:100%;padding:12px;margin-top:6px;">
            </div>

            <div>
                <label>Slug</label>
                <input type="text" name="slug" value="{{ producto.slug }}" style="width:100%;padding:12px;margin-top:6px;">
            </div>

            <div>
                <label>Colección</label>
                <select name="coleccion" required style="width:100%;padding:12px;margin-top:6px;">
                    {% for coleccion in colecciones %}
                        <option value="{{ coleccion.id }}" {% if producto.coleccion_id == coleccion.id %}selected{% endif %}>
                            {{ coleccion.nombre }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label>Proveedor</label>
                <select name="proveedor" style="width:100%;padding:12px;margin-top:6px;">
                    <option value="">Sin proveedor</option>
                    {% for proveedor in proveedores %}
                        <option value="{{ proveedor.id }}" {% if producto.proveedor_id == proveedor.id %}selected{% endif %}>
                            {{ proveedor.nombre }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label>Descripción</label>
                <textarea name="descripcion" rows="4" style="width:100%;padding:12px;margin-top:6px;">{{ producto.descripcion }}</textarea>
            </div>

            <div>
                <label>Material</label>
                <input type="text" name="material" value="{{ producto.material }}" style="width:100%;padding:12px;margin-top:6px;">
            </div>

            <div>
                <label>Precio</label>
                <input type="number" step="0.01" name="precio" value="{{ producto.precio }}" style="width:100%;padding:12px;margin-top:6px;">
            </div>

            <div>
                <label>Costo adquisición</label>
                <input type="number" step="0.01" name="costo_adquisicion" value="{{ producto.costo_adquisicion|default:'' }}" style="width:100%;padding:12px;margin-top:6px;">
            </div>

            <div>
                <label>Tiempo adquisición (días)</label>
                <input type="number" name="tiempo_adquisicion_dias" value="{{ producto.tiempo_adquisicion_dias }}" style="width:100%;padding:12px;margin-top:6px;">
            </div>

            <div>
                <label>Stock objetivo</label>
                <input type="number" name="stock_objetivo" value="{{ producto.stock_objetivo }}" style="width:100%;padding:12px;margin-top:6px;">
            </div>

            <div>
                <label>Notas internas</label>
                <textarea name="notas_internas" rows="4" style="width:100%;padding:12px;margin-top:6px;">{{ producto.notas_internas }}</textarea>
            </div>

            <div>
                <label><input type="checkbox" name="destacado" {% if producto.destacado %}checked{% endif %}> Destacado</label>
            </div>

            <div>
                <label><input type="checkbox" name="activo" {% if producto.activo %}checked{% endif %}> Activo</label>
            </div>

            <div style="display:flex;gap:12px;flex-wrap:wrap;">
                <button type="submit" style="padding:12px 18px;border:none;border-radius:12px;background:var(--accent);color:white;">
                    Guardar cambios
                </button>

                <a href="{% url 'panel_productos' %}" style="padding:12px 18px;border:1px solid var(--line);border-radius:12px;">
                    Volver
                </a>
            </div>
        </div>
    </form>
</div>

{% endblock %}
